# ─────────────────────────────────────────
# trading_agent.yml
# GitHub Actions — runs agent 4x daily
# Schedule: 9am, 12pm, 3pm, 6pm EST
# ─────────────────────────────────────────

name: AI Trading Agent

on:
  schedule:
    - cron: '0 14 * * 1-5'   # 9:00 AM EST  (Mon-Fri)
    - cron: '0 17 * * 1-5'   # 12:00 PM EST (Mon-Fri)
    - cron: '0 20 * * 1-5'   # 3:00 PM EST  (Mon-Fri)
    - cron: '0 23 * * 1-5'   # 6:00 PM EST  (Mon-Fri)
  workflow_dispatch:           # Allows manual trigger from GitHub UI

jobs:
  run-trading-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Trading Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          STARTING_CASH: ${{ secrets.STARTING_CASH }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
        run: python main.py